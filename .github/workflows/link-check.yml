name: Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'

permissions:
  contents: read

jobs:
  catalog-links:
    name: Check catalog links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Check links
        run: npm run check:links -- --report-only --output link-check-report.json --markdown link-check-report.md

      - name: Publish summary
        if: always()
        run: cat link-check-report.md >> "$GITHUB_STEP_SUMMARY"
