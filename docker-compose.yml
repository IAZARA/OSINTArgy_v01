services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: osintargy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-osintargy_dev_password}
      MONGO_INITDB_DATABASE: osintargy
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - osintargy-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: osintargy-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-osintargy_dev_password}@mongodb:27017/osintargy?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-only-osintargy-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-osintargy-refresh-secret-change-me}
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:5173
      LOG_DIR: /app/logs
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - osintargy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: osintargy-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_APP_NAME: OSINTArgy
      VITE_APP_VERSION: 1.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - osintargy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MongoDB Express (Admin Interface)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: osintargy-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-osintargy_dev_password}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-osintargy_dev_password}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-osintargy_admin_dev}
    depends_on:
      - mongodb
    networks:
      - osintargy-network

volumes:
  mongodb_data:
    driver: local

networks:
  osintargy-network:
    driver: bridge
